version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: iomete_proof_db
    environment:
      POSTGRES_USER: iomete_user
      POSTGRES_PASSWORD: iomete_password
      POSTGRES_DB: iomete_proof
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iomete_user -d iomete_proof"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
